<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Web en GitHub Pages</title>
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor principal de la tarjeta */
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        /* Encabezados y textos */
        h1 {
            color: #24292e; /* Color estilo GitHub */
            margin-bottom: 10px;
            font-size: 2rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #586069;
            margin-bottom: 25px;
        }

        /* Insignia de éxito */
        .badge {
            background-color: #2cbe4e;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        /* Botón de acción */
        .btn {
            display: inline-block;
            background-color: #0366d6;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #024ea5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">🚀 ¡Sitio en Línea!</div>
        <h1>¡Hola Mundo!</h1>
        <p>Si estás viendo esto, significa que has configurado y publicado con éxito tu primera página web estática utilizando <strong>GitHub Pages</strong>.</p>
        <a href="https://github.com" target="_blank" class="btn">Ver documentación oficial</a>
    </div>

</body>
</html>
